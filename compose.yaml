services:
  realtime:
    build: ./realtime
    ports:
      - "9000:9000"
    environment:
      PORT: "9000"
      CORS_ORIGIN: "http://localhost:3000"
    restart: unless-stopped

  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_REALTIME_URL: "${NEXT_PUBLIC_REALTIME_URL:-http://localhost:9000}"
    ports:
      - "3000:3000"
    depends_on:
      realtime:
        condition: service_healthy
    restart: unless-stopped

  e2e:
    profiles: ["test"]
    image: mcr.microsoft.com/playwright:v1.65.1-noble
    # network_mode: host needs Linux (Docker Engine); Docker Desktop on macOS/Windows ignores it.
    network_mode: host
    working_dir: /work
    volumes:
      - .:/work
      - /work/node_modules
    environment:
      E2E_BASE_URL: "http://localhost:3000"
      CI: "true"
    command: ["sh", "-c", "npm ci && npx playwright test"]
